<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 360" width="960" height="360" role="img" aria-label="Architecture: your apps call the Homeport gateway. The gateway validates each caller against your identity provider (OIDC), applies throttling and metering, and calls the docked modules with its own short-lived signed token per request (audience: the module; claims: tenant, client, subject, scopes). Catalog modules and your internal API validate that token against the gateway's keys and authorise per endpoint; they never talk to the identity provider. Modules register with the registry. All components send OTLP telemetry to your monitoring."><title>Homeport architecture</title>
<style>
.zone{fill:none;stroke:#7a8898;stroke-dasharray:6 6}.zl{fill:#475869;font:600 13px "Instrument Sans", ui-sans-serif, system-ui, "Segoe UI", sans-serif}
.box{fill:#ffffff;stroke:#7a8898;stroke-width:1.5}.key{stroke:#1d5a8e;stroke-width:2}
.mod{fill:#f2b140;stroke:#a8700c}.mod.new{fill:none;stroke:#a8700c;stroke-dasharray:5 5}
.own{fill:#e3edf6;stroke:#1d5a8e;stroke-width:1.5}
.bt{fill:#0e1e2e;font:600 15px "Instrument Sans", ui-sans-serif, system-ui, "Segoe UI", sans-serif}.bs{fill:#475869;font:500 12px "Instrument Sans", ui-sans-serif, system-ui, "Segoe UI", sans-serif}
.mod+.bt,.mod+.bs{fill:#0e1e2e}.own+.bt,.own+.bs{fill:#0e1e2e}.mod.new+.bs{fill:#475869}
.tag{fill:#0e1e2e;font:500 12px "Instrument Sans", ui-sans-serif, system-ui, "Segoe UI", sans-serif;opacity:.8}.tag2{fill:#1d5a8e;font:600 12px "Instrument Sans", ui-sans-serif, system-ui, "Segoe UI", sans-serif}
.flow{fill:none;stroke:#475869;stroke-width:1.5}.dash{stroke-dasharray:4 5}
</style>
<rect class="zone" x="150" y="20" width="566" height="320" rx="10"/><text class="zl" x="166" y="44">Your environment · docker compose</text>
<rect class="box" x="10" y="150" width="110" height="60" rx="6"/><text class="bt" x="65" y="176" text-anchor="middle">Your apps</text><text class="bs" x="65" y="194" text-anchor="middle">API clients</text>
<rect class="box key" x="180" y="140" width="150" height="80" rx="6"/><text class="bt" x="255" y="170" text-anchor="middle">Gateway</text><text class="bs" x="255" y="188" text-anchor="middle">auth · throttling</text><text class="bs" x="255" y="204" text-anchor="middle">metering</text>
<rect class="box" x="180" y="260" width="150" height="54" rx="6"/><text class="bt" x="255" y="284" text-anchor="middle">Registry</text><text class="bs" x="255" y="300" text-anchor="middle">heartbeats · routes</text>
<g><rect class="mod" x="446" y="80" width="250" height="48" rx="4"/><text class="bt" x="462" y="109">Module A</text><text class="tag" x="680" y="109" text-anchor="end">catalog</text>
<rect class="mod" x="446" y="146" width="250" height="48" rx="4"/><text class="bt" x="462" y="175">Module B</text><text class="tag" x="680" y="175" text-anchor="end">catalog</text>
<rect class="own" x="446" y="212" width="250" height="48" rx="4"/><text class="bt" x="462" y="241">Your internal API</text><text class="tag2" x="680" y="241" text-anchor="end">internal</text>
<rect class="mod new" x="446" y="278" width="250" height="44" rx="4"/><text class="bs" x="462" y="305">+ dock more, ours or yours, no restart</text></g>
<rect class="box" x="790" y="40" width="160" height="60" rx="6"/><text class="bt" x="870" y="66" text-anchor="middle">Your IdP</text><text class="bs" x="870" y="84" text-anchor="middle">Entra ID · Keycloak</text>
<rect class="box" x="790" y="250" width="160" height="60" rx="6"/><text class="bt" x="870" y="276" text-anchor="middle">Your monitoring</text><text class="bs" x="870" y="294" text-anchor="middle">via OTLP</text>
<path class="flow" d="M120 180h60"/><path class="flow" d="M330 180h20v-76h96M350 180h96M350 180v56h96"/>
<path class="flow dash" d="M255 220v40M446 300H330"/>
<path class="flow dash" d="M255 140V64H790"/>
<path class="flow dash" d="M716 200H870V250"/>
<text class="bs" x="356" y="98">signed token</text><text class="bs" x="356" y="174">signed token</text><text class="bs" x="356" y="230">signed token</text>
<text class="bs" x="520" y="56">OIDC · validates the caller</text><text class="bs" x="724" y="192">OTLP · all components</text><text class="bs" x="356" y="294">register</text>
</svg>
