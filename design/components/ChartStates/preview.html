<!-- @dsCard group="Feedback" height=330 subtitle="Every chart: empty, loading, error, degraded" -->
<!doctype html>
<html lang="en">
<head>
<link rel="stylesheet" href="../../dist/site-tokens.css"><link rel="stylesheet" href="../kit.css"><script src="../frame.js"></script><script src="../kit.js"></script><meta charset="utf-8"><title>Chart states</title>
<style>.g{display:grid;grid-template-columns:repeat(4,1fr);gap:var(--space-3)}.plot{height:150px;border-bottom:1px solid var(--viz-axis);position:relative;background:repeating-linear-gradient(to bottom,transparent 0 36px,var(--viz-grid) 36px 37px)}
.plot .hp-state{position:absolute;inset:0;padding:var(--space-2);align-content:center;gap:4px}.plot .hp-state .hp-illus{width:96px;margin:0}
.bars{position:absolute;inset:auto 8px 0 8px;display:flex;gap:6px;align-items:flex-end;height:100%}.bars .hp-skel{flex:1;border-radius:4px 4px 0 0}
.lab{font:600 12px/16px var(--font-sans);color:var(--ink-muted);margin:0 0 6px}</style></head>
<body>
<div class="hp-pad g">
  <div><p class="lab">Empty</p><div class="hp-card"><div class="plot"><div class="hp-state"><i data-illus="spot-calm-buoy"></i><h4>No requests in this period</h4><p>Try 30 d or another tenant.</p></div></div></div></div>
  <div><p class="lab">Loading</p><div class="hp-card"><div class="plot" aria-busy="true"><div class="bars"><div class="hp-skel" style="height:40%"></div><div class="hp-skel" style="height:62%"></div><div class="hp-skel" style="height:48%"></div><div class="hp-skel" style="height:75%"></div><div class="hp-skel" style="height:55%"></div><div class="hp-skel" style="height:68%"></div></div></div></div></div>
  <div><p class="lab">Error</p><div class="hp-card"><div class="plot"><div class="hp-state"><i data-icon="circle-x" style="color:var(--error)"></i><h4>Usage could not load</h4><button class="hp-btn hp-btn--text hp-btn--sm"><i data-icon="refresh-cw" class="hp-icon--sm"></i>Try again</button></div></div></div></div>
  <div><p class="lab">Degraded</p><div class="hp-card"><div class="plot" id="d"></div><div class="hp-stat__meta" style="margin-top:8px;color:var(--warning)"><i data-icon="triangle-alert" class="hp-icon--sm"></i>Partial: data until 14:02</div></div></div>
</div>
<script>
Homeport.hydrate();
(function(){ var p=document.getElementById('d'); p.style.background='none';
p.innerHTML='<svg viewBox="0 0 200 150" preserveAspectRatio="none" style="width:100%;height:150px;display:block"><path d="M0 110 L25 96 L50 100 L75 80 L100 84 L125 70" fill="none" stroke="var(--viz-1)" stroke-width="2" vector-effect="non-scaling-stroke"/><path d="M125 70 L150 72 L175 66 L200 62" fill="none" stroke="var(--viz-1)" stroke-width="2" stroke-dasharray="3 4" opacity=".55" vector-effect="non-scaling-stroke"/><line x1="125" x2="125" y1="0" y2="150" stroke="var(--line-strong)" stroke-dasharray="2 3" vector-effect="non-scaling-stroke"/></svg>'; })();
</script>
</body>
</html>
