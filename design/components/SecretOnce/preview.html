<!-- @dsCard group="Feedback" height=330 subtitle="Client secret shown once: copy, clear warning, confirm" -->
<!doctype html>
<html lang="en">
<head>
<link rel="stylesheet" href="../../dist/site-tokens.css"><link rel="stylesheet" href="../kit.css"><script src="../frame.js"></script><script src="../kit.js"></script><meta charset="utf-8"><title>Secret shown once</title>
<style>
.dlg{max-width:560px;margin:var(--space-6) auto;background:var(--surface-raised);border:1px solid var(--line);border-radius:var(--radius-lg);box-shadow:var(--shadow-3)}
.dlg header{padding:var(--space-5) var(--space-6) 0}.dlg h2{margin:0;font:600 20px/28px var(--font-sans)}
.dlg .body{padding:var(--space-4) var(--space-6);display:grid;gap:var(--space-4)}
.dlg footer{padding:var(--space-4) var(--space-6);border-top:1px solid var(--line);display:flex;justify-content:space-between;align-items:center;gap:var(--space-3)}
.secret{display:flex;gap:var(--space-2);align-items:center;background:var(--surface-sunken);border:1px solid var(--line-strong);border-radius:var(--radius-sm);padding:6px 6px 6px var(--space-3)}
.secret code{flex:1;font:500 14px/22px var(--font-mono);word-break:break-all;color:var(--ink)}
.lbl{font:600 12px/16px var(--font-sans);color:var(--ink-muted);margin-bottom:4px}
label.ck{display:flex;gap:var(--space-2);align-items:center;font-size:14px}
</style></head>
<body>
<div class="dlg" role="dialog" aria-labelledby="t">
  <header><h2 id="t">Client secret for "erp-export"</h2></header>
  <div class="body">
    <div class="hp-alert hp-alert--warning"><i data-icon="triangle-alert"></i><div><strong>Copy it now. You will not see it again.</strong>Homeport stores only a hash. If you lose it, rotate the secret.</div></div>
    <div><div class="lbl">Client ID</div><span class="hp-chip">c_8f2a91d0</span></div>
    <div><div class="lbl">Client secret</div>
      <div class="secret"><code id="sec">hp_live_7Kq2vX9mR4tW8nB3yL6pZ1cF5hJ0dS2g</code>
      <button class="hp-btn hp-btn--primary hp-btn--sm" data-copy="#sec"><i data-icon="copy" class="hp-icon--sm"></i><span class="lab">Copy</span></button></div></div>
    <label class="ck"><input type="checkbox"> I have stored the secret in a safe place</label>
  </div>
  <footer><span class="hp-muted" style="font-size:13px">Scopes: <span class="hp-chip">usage:read</span> <span class="hp-chip">export:write</span></span><button class="hp-btn hp-btn--outline">Done</button></footer>
</div>
<script>Homeport.hydrate();</script>
</body>
</html>
