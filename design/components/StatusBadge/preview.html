<!-- @dsCard group="Status" height=96 subtitle="Icon + word + color, never color alone" -->
<!doctype html>
<html lang="en">
<head>
<link rel="stylesheet" href="../../dist/site-tokens.css"><link rel="stylesheet" href="../kit.css"><script src="../frame.js"></script><script src="../kit.js"></script><meta charset="utf-8"><title>Status badge</title></head>
<body>
<div class="hp-stack hp-pad">
  <div class="hp-row">
    <span class="hp-badge hp-badge--success"><i data-icon="circle-check"></i>Success</span>
    <span class="hp-badge hp-badge--warning"><i data-icon="triangle-alert"></i>Warning</span>
    <span class="hp-badge hp-badge--error"><i data-icon="circle-x"></i>Error</span>
    <span class="hp-badge hp-badge--info"><i data-icon="info"></i>Info</span>
    <span class="hp-badge hp-badge--neutral"><i data-icon="clock"></i>Pending</span>
  </div>
  <div class="hp-row">
    <span class="hp-badge hp-badge--available"><i data-icon="circle-check"></i>available</span>
    <span class="hp-badge hp-badge--progress"><i data-icon="loader-circle"></i>in progress</span>
    <span class="hp-badge hp-badge--planned"><i data-icon="calendar-range"></i>planned</span>
    <span class="hp-chip">plan: business</span>
    <span class="hp-chip">v2.4.1</span>
  </div>
</div>
<script>Homeport.hydrate();</script>
</body>
</html>
