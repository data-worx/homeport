<!-- @dsCard group="Code" height=190 subtitle="Copyable terminal snippet, same in both themes" -->
<!doctype html>
<html lang="en">
<head>
<link rel="stylesheet" href="../../dist/site-tokens.css"><link rel="stylesheet" href="../kit.css"><script src="../frame.js"></script><script src="../kit.js"></script><meta charset="utf-8"><title>Code snippet</title></head>
<body>
<div class="hp-pad" style="max-width:640px">
  <div class="hp-code hp-inverse">
    <pre id="qs"><span class="hp-comment"># Pull and start Homeport</span>
<span class="hp-prompt">$ </span>curl -fsSLO https://homeport.data-worx.de/compose.yaml
<span class="hp-prompt">$ </span>docker compose up -d</pre>
    <button class="hp-code__copy" data-copy="#qs" aria-label="Copy commands"><i data-icon="copy" class="hp-icon--sm"></i></button>
  </div>
</div>
<script>Homeport.hydrate();</script>
</body>
</html>
