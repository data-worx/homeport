#
# Runs every gate of .devkit/gates.sh on every pull request against main and
# every push to main. The runner has Docker, which the integration and
# end-to-end tests need, and Node.js, which the design gate needs.
name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  gates:
    runs-on: ubuntu-latest
    # A full run takes about 6 minutes; a hang must not hold a runner for hours.
    timeout-minutes: 30
    env:
      DOTNET_NOLOGO: true
      DOTNET_CLI_TELEMETRY_OPTOUT: true
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          dotnet-version: 10.0.x
      # The AppHost serves the portal over HTTPS with the development
      # certificate, which a developer's machine trusts (running-locally.md);
      # the end-to-end tests reach it there. On Linux, --trust puts the
      # certificate into a directory OpenSSL reads only through SSL_CERT_DIR.
      - run: |
          dotnet dev-certs https --trust
          echo "SSL_CERT_DIR=${HOME}/.aspnet/dev-certs/trust:/usr/lib/ssl/certs" >> "${GITHUB_ENV}"
      - run: bash .devkit/gates.sh
