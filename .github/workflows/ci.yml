#
# Runs the gates of .devkit/gates.sh - build, test, format, notices - on every
# pull request against main and every push to main. The runner has Docker,
# which the integration and end-to-end tests need.
name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  gates:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      DOTNET_NOLOGO: true
      DOTNET_CLI_TELEMETRY_OPTOUT: true
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: 10.0.x
      - run: dotnet build Homeport.slnx --nologo
      - run: >-
          dotnet test Homeport.slnx --nologo --no-build
          --blame-hang-timeout 3m --blame-hang-dump-type full
          --results-directory "${{ runner.temp }}/test-results"
      - if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: hang-dump
          path: ${{ runner.temp }}/test-results
          retention-days: 3
      - run: bash .devkit/gates.sh
