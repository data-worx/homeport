# SPDX-License-Identifier: AGPL-3.0-or-later
#
# Releases a tag (ADR-0009, core.releasing): vX.Y.Z, or vX.Y.Z-rc.N for a
# candidate, on main or on release/X.Y, with its section in CHANGELOG.md. The
# version comes from the tag. The gates run on the tagged commit first, and
# only then is anything pushed: every own image of deploy/compose/ is built
# with that version, scanned, pushed to GHCR, signed with cosign and carries
# its SBOM as a signed attestation. The GitHub release carries the compose
# file pinned to the released images, the deploy directory it needs and one
# SBOM per image. See docs/releasing.md and docs/operators/verifying-images.md.
name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  # The gates on the tagged commit (core.releasing): a green request does not
  # stand in for them, since the tag may point at a commit no request was
  # built from. This job can write nothing.
  gates:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      DOTNET_NOLOGO: true
      DOTNET_CLI_TELEMETRY_OPTOUT: true
      TAG: ${{ github.ref_name }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The whole history, so check-release.sh sees which branch the tag is on.
          fetch-depth: 0
      # Refuses a tag that may not be released before the gates spend time on it.
      - run: bash .github/scripts/check-release.sh "${TAG}" release-notes.md
      - uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          dotnet-version: 10.0.x
      # The AppHost serves the portal over HTTPS with the development
      # certificate, which a developer's machine trusts (running-locally.md);
      # the end-to-end tests reach it there. On Linux, --trust puts the
      # certificate into a directory OpenSSL reads only through SSL_CERT_DIR,
      # and exits with 4 because no browser trusts it: OpenSSL is the only
      # client here, so 4 passes and every other failure does not.
      - run: |
          dotnet dev-certs https --trust || [ "$?" -eq 4 ]
          echo "SSL_CERT_DIR=${HOME}/.aspnet/dev-certs/trust:/usr/lib/ssl/certs" >> "${GITHUB_ENV}"
      - run: bash .devkit/gates.sh

  release:
    needs: gates
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: write # the GitHub release
      packages: write # the images in GHCR
    env:
      DOTNET_NOLOGO: true
      DOTNET_CLI_TELEMETRY_OPTOUT: true
      TAG: ${{ github.ref_name }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The whole history, so check-release.sh sees which branch the tag is on.
          fetch-depth: 0
      - id: check
        run: bash .github/scripts/check-release.sh "${TAG}" release-notes.md >> "${GITHUB_OUTPUT}"
      - uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          dotnet-version: 10.0.x
      - uses: aquasecurity/setup-trivy@81e514348e19b6112ce2a7e3ecbafe19c1e1f567 # v0.3.1
        with:
          version: v0.76.2
          cache: true
      - uses: sigstore/cosign-installer@756fe2d284c7292c4e9b62c8a28f1e5629c59532 # v4.1.3
        with:
          cosign-release: v3.1.4
      - run: echo "${GH_TOKEN}" | docker login ghcr.io --username "${GITHUB_ACTOR}" --password-stdin
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - run: bash .github/scripts/release-images.sh "${{ steps.check.outputs.version }}" release
        env:
          COSIGN_PRIVATE_KEY: ${{ secrets.COSIGN_PRIVATE_KEY }}
          COSIGN_PASSWORD: ${{ secrets.COSIGN_PASSWORD }}
      - name: Assemble the release assets
        run: |
          bash .github/scripts/render-compose.sh release/images.env release/docker-compose.yaml
          bundle="homeport-deploy-${TAG#v}"
          mkdir -p "release/${bundle}/deploy"
          cp -r deploy/compose deploy/keycloak deploy/postgres deploy/rabbitmq "release/${bundle}/deploy/"
          cp release/docker-compose.yaml "release/${bundle}/deploy/compose/docker-compose.yaml"
          tar -czf "release/${bundle}.tar.gz" -C release "${bundle}"
      - name: Create the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          PRERELEASE: ${{ steps.check.outputs.prerelease }}
          LATEST: ${{ steps.check.outputs.latest }}
        run: |
          # A candidate is a prerelease, and only a release from main is the latest.
          flags=("--latest=${LATEST}")
          if [ "${PRERELEASE}" = "true" ]; then flags+=(--prerelease); fi
          gh release create "${TAG}" --verify-tag --title "Homeport ${TAG#v}" \
            --notes-file release-notes.md "${flags[@]}" \
            release/docker-compose.yaml "release/homeport-deploy-${TAG#v}.tar.gz" release/sbom/*.cdx.json
