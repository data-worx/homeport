# SPDX-License-Identifier: AGPL-3.0-or-later
#
# Asks every contributor to sign CLA.md and records the signature in the
# private repository data-worx/cla-signatures. Runs on pull_request_target so
# it works for pull requests from forks; it never checks out their code.
name: CLA

on:
  issue_comment:
    types: [created]
  pull_request_target:
    types: [opened, closed, synchronize]

permissions:
  actions: write
  contents: read
  pull-requests: write
  statuses: write

jobs:
  cla:
    if: >-
      github.event_name == 'pull_request_target' ||
      github.event.comment.body == 'recheck' ||
      github.event.comment.body == 'I have read the CLA Document and I hereby sign the CLA'
    runs-on: ubuntu-latest
    steps:
      - uses: contributor-assistant/github-action@ca4a40a7d1004f18d9960b404b97e5f30a505a08 # v2.6.1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PERSONAL_ACCESS_TOKEN: ${{ secrets.CLA_SIGNATURES_TOKEN }}
        with:
          path-to-document: https://github.com/data-worx/homeport/blob/main/CLA.md
          path-to-signatures: signatures/version1/cla.json
          branch: main
          remote-organization-name: data-worx
          remote-repository-name: cla-signatures
          allowlist: raisr,dependabot[bot],github-actions[bot]
