services:
  postgres:
    image: "docker.io/library/postgres:18.6-alpine@sha256:123b17998ccaf47e53b502e8c6a1e79afd8f579c6f3eec83c563da026f957395"
    environment:
      POSTGRES_HOST_AUTH_METHOD: "scram-sha-256"
      POSTGRES_INITDB_ARGS: "--auth-host=scram-sha-256 --auth-local=scram-sha-256 --locale-provider=icu --icu-locale=und"
      POSTGRES_USER: "postgres"
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD}"
      POSTGRES_DB: "homeport"
      CONTROL_PLANE_OWNER_PASSWORD: "${CONTROL_PLANE_OWNER_PASSWORD}"
      CONTROL_PLANE_APP_PASSWORD: "${CONTROL_PLANE_APP_PASSWORD}"
      METERING_OWNER_PASSWORD: "${METERING_OWNER_PASSWORD}"
      METERING_APP_PASSWORD: "${METERING_APP_PASSWORD}"
    expose:
      - "5432"
    volumes:
      - type: "bind"
        target: "/docker-entrypoint-initdb.d"
        source: "${POSTGRES_BINDMOUNT_0}"
        read_only: true
    networks:
      - "aspire"
  rabbitmq:
    image: "docker.io/library/rabbitmq:4.3-alpine@sha256:68fd0566c1c5a5aef2d7b3ad55af8be503a767c1ff8646d7088c8c7946270cf9"
    command:
      - "/homeport-init/init-homeport.sh"
      - "rabbitmq-server"
    entrypoint:
      - "bash"
    environment:
      RABBITMQ_DEFAULT_USER: "guest"
      RABBITMQ_DEFAULT_PASS: "${RABBITMQ_PASSWORD}"
      GATEWAY_RABBITMQ_PASSWORD: "${GATEWAY_RABBITMQ_PASSWORD}"
      METERING_RABBITMQ_PASSWORD: "${METERING_RABBITMQ_PASSWORD}"
    expose:
      - "5672"
    volumes:
      - type: "bind"
        target: "/homeport-init"
        source: "${RABBITMQ_BINDMOUNT_0}"
        read_only: true
    networks:
      - "aspire"
  valkey:
    image: "docker.io/valkey/valkey:9.1-alpine@sha256:bf09d58e96d6b4524a15396b65b242bbe18beebbcc15a04d8ee75ddac62fae0b"
    command:
      - "-c"
      - "valkey-server --requirepass $$VALKEY_PASSWORD"
    entrypoint:
      - "/bin/sh"
    environment:
      VALKEY_PASSWORD: "${VALKEY_PASSWORD}"
    expose:
      - "6379"
    networks:
      - "aspire"
  keycloak:
    image: "quay.io/keycloak/keycloak:26.8@sha256:3879c623248408de29a5303178b5816c77e8dfef3890c361f8c0bbeaa979ba3b"
    command:
      - "start-dev"
      - "--import-realm"
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: "admin"
      KC_BOOTSTRAP_ADMIN_PASSWORD: "${KEYCLOAK_PASSWORD}"
      KC_HEALTH_ENABLED: "true"
      KC_FEATURES: "opentelemetry"
      HOMEPORT_LOCAL_CLIENT_ID: "${SEED_CLIENT_ID}"
      HOMEPORT_LOCAL_CLIENT_SECRET: "${LOCAL_CLIENT_SECRET}"
      HOMEPORT_UNMAPPED_CLIENT_SECRET: "${UNMAPPED_CLIENT_SECRET}"
      HOMEPORT_AUDIENCE: "homeport"
      KC_HOSTNAME: "http://localhost:8080"
      KC_HOSTNAME_BACKCHANNEL_DYNAMIC: "true"
    ports:
      - "8080:8080"
      - "9000"
    volumes:
      - type: "bind"
        target: "/opt/keycloak/data/import"
        source: "${KEYCLOAK_BINDMOUNT_0}"
        read_only: true
    networks:
      - "aspire"
  registry:
    image: "${REGISTRY_IMAGE}"
    environment:
      OTEL_DOTNET_EXPERIMENTAL_OTLP_RETRY: "in_memory"
      ASPNETCORE_FORWARDEDHEADERS_ENABLED: "true"
      HTTP_PORTS: "${REGISTRY_PORT}"
      OTEL_SERVICE_NAME: "homeport-registry"
      Registry__RegistrationKeys__echo__0: "${ECHO_REGISTRATION_KEY}"
      ConnectionStrings__valkey: "valkey:6379,password=${VALKEY_PASSWORD}"
      VALKEY_HOST: "valkey"
      VALKEY_PORT: "6379"
      VALKEY_PASSWORD: "${VALKEY_PASSWORD}"
      VALKEY_URI: "valkey://:${VALKEY_PASSWORD}@valkey:6379"
      GATEWAY_HTTP: "http://gateway:${GATEWAY_PORT}"
      services__gateway__http__0: "http://gateway:${GATEWAY_PORT}"
      GATEWAY_HTTPS: "https://gateway:${GATEWAY_PORT}"
    expose:
      - "${REGISTRY_PORT}"
    depends_on:
      valkey:
        condition: "service_started"
    networks:
      - "aspire"
  echo:
    image: "${ECHO_IMAGE}"
    environment:
      OTEL_DOTNET_EXPERIMENTAL_OTLP_RETRY: "in_memory"
      ASPNETCORE_FORWARDEDHEADERS_ENABLED: "true"
      HTTP_PORTS: "${ECHO_PORT}"
      OTEL_SERVICE_NAME: "homeport-module-echo"
      Homeport__Registry__Url: "http://registry"
      Homeport__Registry__Key: "${ECHO_REGISTRATION_KEY}"
      REGISTRY_HTTP: "http://registry:${REGISTRY_PORT}"
      services__registry__http__0: "http://registry:${REGISTRY_PORT}"
      REGISTRY_HTTPS: "https://registry:${REGISTRY_PORT}"
      Homeport__Registry__InstanceAddress: "http://echo:${ECHO_PORT}"
      GATEWAY_HTTP: "http://gateway:${GATEWAY_PORT}"
      services__gateway__http__0: "http://gateway:${GATEWAY_PORT}"
      GATEWAY_HTTPS: "https://gateway:${GATEWAY_PORT}"
    expose:
      - "${ECHO_PORT}"
    networks:
      - "aspire"
  gateway:
    image: "${GATEWAY_IMAGE}"
    environment:
      OTEL_DOTNET_EXPERIMENTAL_OTLP_RETRY: "in_memory"
      HTTP_PORTS: "${GATEWAY_PORT}"
      OTEL_SERVICE_NAME: "homeport-gateway"
      Signing__Key: "${GATEWAY_SIGNING_KEY}"
      Signing__KeyId: "${GATEWAY_SIGNING_KEY_ID}"
      Signing__AdditionalPublicKey: "${GATEWAY_ADDITIONAL_PUBLIC_KEY}"
      Signing__AdditionalKeyId: "${GATEWAY_ADDITIONAL_KEY_ID}"
      ClientAuthentication__Authority: "http://keycloak:8080/realms/homeport"
      ClientAuthentication__Audience: "homeport"
      ClientAuthentication__RequireHttpsMetadata: "False"
      REGISTRY_HTTP: "http://registry:${REGISTRY_PORT}"
      services__registry__http__0: "http://registry:${REGISTRY_PORT}"
      REGISTRY_HTTPS: "https://registry:${REGISTRY_PORT}"
      ConnectionStrings__rabbitmq: "amqp://gateway:${GATEWAY_RABBITMQ_PASSWORD}@rabbitmq:5672"
      ConnectionStrings__valkey: "valkey:6379,password=${VALKEY_PASSWORD}"
      VALKEY_HOST: "valkey"
      VALKEY_PORT: "6379"
      VALKEY_PASSWORD: "${VALKEY_PASSWORD}"
      VALKEY_URI: "valkey://:${VALKEY_PASSWORD}@valkey:6379"
      CONTROL_PLANE_HTTP: "http://control-plane:${CONTROL_PLANE_PORT}"
      services__control-plane__http__0: "http://control-plane:${CONTROL_PLANE_PORT}"
      CONTROL_PLANE_HTTPS: "https://control-plane:${CONTROL_PLANE_PORT}"
      PlatformRoutes__MeteringUrl: "http://metering:${METERING_PORT}"
    ports:
      - "${GATEWAY_PORT}"
    depends_on:
      rabbitmq:
        condition: "service_started"
      valkey:
        condition: "service_started"
    networks:
      - "aspire"
    deploy:
      replicas: 2
  control-plane-migrate:
    image: "${CONTROL_PLANE_MIGRATE_IMAGE}"
    command:
      - "migrate"
    environment:
      OTEL_DOTNET_EXPERIMENTAL_OTLP_RETRY: "in_memory"
      OTEL_SERVICE_NAME: "homeport-control-plane-migrate"
      ConnectionStrings__control-plane-owner: "Host=postgres;Port=5432;Database=homeport;Username=control_plane_owner;Password=${CONTROL_PLANE_OWNER_PASSWORD}"
      Seed__TenantId: "${SEED_TENANT_ID}"
      Seed__TenantName: "${SEED_TENANT_NAME}"
      Seed__PlanId: "${SEED_PLAN_ID}"
      Seed__PlanName: "${SEED_PLAN_NAME}"
      Seed__RequestsPerSecond: "${SEED_PLAN_REQUESTS_PER_SECOND}"
      Seed__Burst: "${SEED_PLAN_BURST}"
      Seed__ClientId: "${SEED_CLIENT_ID}"
    depends_on:
      postgres:
        condition: "service_started"
    networks:
      - "aspire"
  control-plane:
    image: "${CONTROL_PLANE_IMAGE}"
    environment:
      OTEL_DOTNET_EXPERIMENTAL_OTLP_RETRY: "in_memory"
      ASPNETCORE_FORWARDEDHEADERS_ENABLED: "true"
      HTTP_PORTS: "${CONTROL_PLANE_PORT}"
      OTEL_SERVICE_NAME: "homeport-control-plane"
      ConnectionStrings__control-plane: "Host=postgres;Port=5432;Database=homeport;Username=control_plane_app;Password=${CONTROL_PLANE_APP_PASSWORD}"
      GATEWAY_HTTP: "http://gateway:${GATEWAY_PORT}"
      services__gateway__http__0: "http://gateway:${GATEWAY_PORT}"
      GATEWAY_HTTPS: "https://gateway:${GATEWAY_PORT}"
    expose:
      - "${CONTROL_PLANE_PORT}"
    depends_on:
      control-plane-migrate:
        condition: "service_completed_successfully"
    networks:
      - "aspire"
  metering-migrate:
    image: "${METERING_MIGRATE_IMAGE}"
    command:
      - "migrate"
    environment:
      OTEL_DOTNET_EXPERIMENTAL_OTLP_RETRY: "in_memory"
      OTEL_SERVICE_NAME: "homeport-metering-migrate"
      ConnectionStrings__metering-owner: "Host=postgres;Port=5432;Database=homeport;Username=metering_owner;Password=${METERING_OWNER_PASSWORD}"
    depends_on:
      postgres:
        condition: "service_started"
    networks:
      - "aspire"
  metering:
    image: "${METERING_IMAGE}"
    environment:
      OTEL_DOTNET_EXPERIMENTAL_OTLP_RETRY: "in_memory"
      ASPNETCORE_FORWARDEDHEADERS_ENABLED: "true"
      HTTP_PORTS: "${METERING_PORT}"
      OTEL_SERVICE_NAME: "homeport-metering"
      ConnectionStrings__metering: "Host=postgres;Port=5432;Database=homeport;Username=metering_app;Password=${METERING_APP_PASSWORD}"
      ConnectionStrings__rabbitmq: "amqp://metering:${METERING_RABBITMQ_PASSWORD}@rabbitmq:5672"
      GATEWAY_HTTP: "http://gateway:${GATEWAY_PORT}"
      services__gateway__http__0: "http://gateway:${GATEWAY_PORT}"
      GATEWAY_HTTPS: "https://gateway:${GATEWAY_PORT}"
    expose:
      - "${METERING_PORT}"
    depends_on:
      metering-migrate:
        condition: "service_completed_successfully"
      rabbitmq:
        condition: "service_started"
    networks:
      - "aspire"
networks:
  aspire:
    driver: "bridge"
