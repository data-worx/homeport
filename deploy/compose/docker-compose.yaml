services:
  postgres:
    image: "docker.io/library/postgres@sha256:7e32e9833a6fb1c92c32552794cb6ed569d51b445a54907d35fc112ef39684db"
    environment:
      POSTGRES_HOST_AUTH_METHOD: "scram-sha-256"
      POSTGRES_INITDB_ARGS: "--auth-host=scram-sha-256 --auth-local=scram-sha-256"
      POSTGRES_USER: "postgres"
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD}"
    expose:
      - "5432"
    networks:
      - "aspire"
  rabbitmq:
    image: "docker.io/library/rabbitmq@sha256:8144dac709541439da6106d7421079132171b7f0a48b7a7b1f4bd39b22abdb75"
    environment:
      RABBITMQ_DEFAULT_USER: "guest"
      RABBITMQ_DEFAULT_PASS: "${RABBITMQ_PASSWORD}"
    expose:
      - "5672"
    networks:
      - "aspire"
  valkey:
    image: "docker.io/valkey/valkey@sha256:418652cfb58ef879d4978c33553735d7147016032d5aefaa14c828e611eb9dfd"
    command:
      - "-c"
      - "valkey-server --requirepass $$VALKEY_PASSWORD"
    entrypoint:
      - "/bin/sh"
    environment:
      VALKEY_PASSWORD: "${VALKEY_PASSWORD}"
    expose:
      - "6379"
    networks:
      - "aspire"
  keycloak:
    image: "quay.io/keycloak/keycloak@sha256:0aae0de7fca85525f727d3354df17896092de8bb26ae4c12d89c77e5df8cbce4"
    command:
      - "start-dev"
      - "--import-realm"
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: "admin"
      KC_BOOTSTRAP_ADMIN_PASSWORD: "${KEYCLOAK_PASSWORD}"
      KC_HEALTH_ENABLED: "true"
      KC_FEATURES: "opentelemetry"
    expose:
      - "8080"
      - "9000"
    networks:
      - "aspire"
  registry:
    image: "${REGISTRY_IMAGE}"
    environment:
      OTEL_DOTNET_EXPERIMENTAL_OTLP_RETRY: "in_memory"
      ASPNETCORE_FORWARDEDHEADERS_ENABLED: "true"
      HTTP_PORTS: "${REGISTRY_PORT}"
      OTEL_SERVICE_NAME: "homeport-registry"
      Registry__RegistrationKeys__echo__0: "${ECHO_REGISTRATION_KEY}"
      ConnectionStrings__valkey: "valkey:6379,password=${VALKEY_PASSWORD}"
      VALKEY_HOST: "valkey"
      VALKEY_PORT: "6379"
      VALKEY_PASSWORD: "${VALKEY_PASSWORD}"
      VALKEY_URI: "valkey://:${VALKEY_PASSWORD}@valkey:6379"
      GATEWAY_HTTP: "http://gateway:${GATEWAY_PORT}"
      services__gateway__http__0: "http://gateway:${GATEWAY_PORT}"
      GATEWAY_HTTPS: "https://gateway:${GATEWAY_PORT}"
    expose:
      - "${REGISTRY_PORT}"
    depends_on:
      valkey:
        condition: "service_started"
    networks:
      - "aspire"
  echo:
    image: "${ECHO_IMAGE}"
    environment:
      OTEL_DOTNET_EXPERIMENTAL_OTLP_RETRY: "in_memory"
      ASPNETCORE_FORWARDEDHEADERS_ENABLED: "true"
      HTTP_PORTS: "${ECHO_PORT}"
      OTEL_SERVICE_NAME: "homeport-module-echo"
      Homeport__Registry__Url: "http://registry"
      Homeport__Registry__Key: "${ECHO_REGISTRATION_KEY}"
      REGISTRY_HTTP: "http://registry:${REGISTRY_PORT}"
      services__registry__http__0: "http://registry:${REGISTRY_PORT}"
      REGISTRY_HTTPS: "https://registry:${REGISTRY_PORT}"
      Homeport__Registry__InstanceAddress: "http://echo:${ECHO_PORT}"
    expose:
      - "${ECHO_PORT}"
    networks:
      - "aspire"
  gateway:
    image: "${GATEWAY_IMAGE}"
    environment:
      OTEL_DOTNET_EXPERIMENTAL_OTLP_RETRY: "in_memory"
      ASPNETCORE_FORWARDEDHEADERS_ENABLED: "true"
      HTTP_PORTS: "${GATEWAY_PORT}"
      OTEL_SERVICE_NAME: "homeport-gateway"
      Signing__Key: "${GATEWAY_SIGNING_KEY}"
      Signing__KeyId: "${GATEWAY_SIGNING_KEY_ID}"
      Signing__AdditionalPublicKey: "${GATEWAY_ADDITIONAL_PUBLIC_KEY}"
      Signing__AdditionalKeyId: "${GATEWAY_ADDITIONAL_KEY_ID}"
      REGISTRY_HTTP: "http://registry:${REGISTRY_PORT}"
      services__registry__http__0: "http://registry:${REGISTRY_PORT}"
      REGISTRY_HTTPS: "https://registry:${REGISTRY_PORT}"
    ports:
      - "${GATEWAY_PORT}"
    networks:
      - "aspire"
networks:
  aspire:
    driver: "bridge"
